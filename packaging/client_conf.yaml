# Tibra client configuration.
#
# Edit this file to point the client at a different game world, then restart it.
# Both entries are optional -- a missing one falls back to the localhost default
# baked into the client.

# host:port of the game server's TCP listener.
server_address: "127.0.0.1:5555"

# The site's public origin. Login and the character list hang off it.
site_url: "http://127.0.0.1:8080"
